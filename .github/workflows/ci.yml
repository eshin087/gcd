name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels that PR's run still in progress (only the last commit's result counts).
# Runs on main are keyed by commit, so they never cancel each other.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
